<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Upload</title>
    <style>
        body { background: #4A148C; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; margin:0;}
        .btn { background: #E1BEE7; color: #4A148C; padding: 20px 40px; border-radius: 50px; font-size: 22px; font-weight: bold; cursor: pointer; display: inline-block; margin-top: 20px; text-decoration: none;}
    </style>
</head>
<body>
    <h1>PharmaCam 📸</h1>
    <form action="{{ url_for('prescriptions_bp.mobile_upload', token=token) }}" method="POST" enctype="multipart/form-data" id="uploadForm">
        <input type="file" name="file" id="camInput" accept="image/*" capture="environment" style="display:none" onchange="document.getElementById('uploadForm').submit(); document.getElementById('msg').style.display='block';">
        <label for="camInput" class="btn">Open Camera</label>
    </form>
    <p id="msg" style="display:none; margin-top:20px; font-weight:bold;">Uploading...</p>
</body>
</html>
