{% extends "layout.html" %}
{% block title %}Scan to Upload | PharmaTrust{% endblock %}

{% block content %}
<div style="text-align:center; margin-top: 50px;">
    <div style="background:white; display:inline-block; padding:40px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.1);">
        
        <h2 style="color:#4A148C;">📱 Mobile Upload</h2>
        <p>Scan this QR code with your phone.</p>

        <div style="margin: 20px 0;">
            <img src="{{ url_for('prescriptions_bp.generate_qr', url=mobile_url) }}" style="border: 8px solid #F3E5F5; border-radius:10px; width:250px;">
        </div>

        <div id="status-box" style="padding:15px; background:#FFF3E0; color:#E65100; border-radius:8px; font-weight:bold;">
            <i class="fas fa-spinner fa-spin"></i> Waiting for scan...
        </div>

        <p style="font-size:12px; color:#999; margin-top:20px;">
            QR Link: {{ mobile_url }}
        </p>
    </div>
</div>

<script>
    const token = "{{ token }}";
    const statusBox = document.getElementById("status-box");

    // Poll every 1.5 seconds
    const interval = setInterval(() => {
        fetch(`/prescriptions/check_status/${token}`)
        .then(res => res.json())
        .then(data => {
            if (data.status === "done") {
                clearInterval(interval);
                statusBox.style.background = "#E8F5E9";
                statusBox.style.color = "#2E7D32";
                statusBox.innerHTML = `✅ Received: ${data.filename}`;
            } 
        });
    }, 1500);
</script>
{% endblock %}
