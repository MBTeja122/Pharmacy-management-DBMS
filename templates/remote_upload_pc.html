{% extends "layout.html" %}
{% block content %}
<div style="text-align: center; padding: 50px;">
    <div style="background: white; padding: 40px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
        <h2 style="color: #00695c; margin-bottom: 10px;">📲 Connect Mobile</h2>
        <p style="color: #666; margin-bottom: 30px;">Scan to upload from Gallery</p>
        
        <img src="{{ url_for('prescriptions_bp.generate_qr', url=mobile_url) }}" style="width: 250px; border-radius: 10px; border: 2px solid #b2dfdb;">
        
        <div style="margin-top: 30px;">
            <div class="spinner" style="display:inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #00695c; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <span style="color: #00695c; font-weight: bold; margin-left: 10px;">Waiting for upload...</span>
        </div>
        
        <p style="margin-top:20px; font-size:12px; color:#999; font-family:monospace;">{{ mobile_url }}</p>
    </div>
</div>

<style>@keyframes spin {0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }}</style>

<script>
    setInterval(function() {
        fetch("{{ url_for('prescriptions_bp.check_status', token=token) }}")
        .then(response => response.json())
        .then(data => {
            if (data.status === "done") {
                // REDIRECT TO REVIEW PAGE
                window.location.href = "/prescriptions/review/" + data.filename;
            }
        });
    }, 2000);
</script>
{% endblock %}
