{% extends "layout.html" %}
{% block title %}Upload Prescription | PharmaTrust{% endblock %}

{% block content %}
<div style="background: white; padding: 40px; border-radius: 16px; max-width: 600px; margin: 0 auto; box-shadow: 0 10px 30px rgba(74, 20, 140, 0.1);">
    <h2 style="color: #4A148C; text-align: center; margin-bottom: 30px;">
        <i class="fas fa-file-medical"></i> Upload Prescription
    </h2>

    <form action="{{ url_for('prescriptions_bp.upload_file') }}" method="POST" enctype="multipart/form-data">
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: 600; margin-bottom: 8px;">Patient Name</label>
            <input type="text" name="patient_name" required style="width: 100%; padding: 12px; border: 2px solid #D1C4E9; border-radius: 8px;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: 600; margin-bottom: 8px;">Doctor Name</label>
            <input type="text" name="doctor_name" required style="width: 100%; padding: 12px; border: 2px solid #D1C4E9; border-radius: 8px;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: 600; margin-bottom: 8px;">Document</label>
            <input type="file" name="file" accept=".pdf, .jpg, .png" required style="padding: 10px;">
        </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <a href="{{ url_for('prescriptions_bp.remote_upload_page') }}" style="display:inline-block; background:#E1BEE7; color:#4A148C; padding:10px 20px; border-radius:20px; text-decoration:none; font-weight:bold;">
                <i class="fas fa-camera"></i> Use Phone Camera Instead
            </a>
        </div>

        <button type="submit" style="width: 100%; padding: 15px; background: #4A148C; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;">
            Save to Database
        </button>
    </form>
</div>
{% endblock %}
